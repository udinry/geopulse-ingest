name: Outlook source check

# Fetch-only (no database, no secrets): confirms the outlook source's real response shape
# from a runner network that can reach it.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run outlook:check
