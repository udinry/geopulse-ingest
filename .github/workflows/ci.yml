name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # tests/schema.test.ts applies migrations/*.sql via the sqlite3 CLI directly —
      # this is the actual portability check for D1 (same SQL dialect), so don't
      # assume the runner image has it; make it explicit and version-pinned in intent.
      - run: sqlite3 --version || sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
